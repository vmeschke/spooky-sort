/* Layout: one-screen game. Header with night + stats, jars centered on the board, a tip line, four action buttons over a moonlit hillside. */
:root{
  color-scheme: dark;
  --night-0:#0c0820;
  --night-1:#171034;
  --night-2:#251650;
  --ink:#f4efff;
  --ink-dim:#a89fd4;
  --edge:rgba(206,190,255,.36);
  --glass-hi:rgba(222,210,255,.18);
  --glow:#ffb35c;
  --hill:#08051a;
  --c-pumpkin:#ff8a2b;
  --c-ghost:#f6f3ff;
  --c-bat:#a27bff;
  --c-slime:#7ee35b;
  --c-corn:#ffd43b;
  --c-hat:#2fc7c2;
  --c-candy:#ff6ba8;
  --c-spider:#b8aef5;
  --c-skull:#eadfc8;
  --c-eye:#ff5a5f;
  --c-cat:#ffb35c;
  --c-mummy:#bcd0ee;
  --font-display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Avenir Next Rounded','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--night-1);
  background-image:
    radial-gradient(120% 60% at 50% 110%, rgba(96,52,170,.55) 0%, rgba(96,52,170,0) 62%),
    linear-gradient(180deg, var(--night-0) 0%, var(--night-1) 55%, var(--night-2) 100%);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:600;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* Sky */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;inset:0;opacity:.85;animation:twinkle 5s ease-in-out infinite}
.stars.a{background-image:
  radial-gradient(1.6px 1.6px at 8% 12%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 22% 30%, #fff, transparent 60%),
  radial-gradient(1.8px 1.8px at 38% 8%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 61% 22%, #fff, transparent 60%),
  radial-gradient(1.6px 1.6px at 84% 14%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 93% 38%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 12% 58%, #fff, transparent 60%)}
.stars.b{animation-delay:-2.5s;background-image:
  radial-gradient(1.4px 1.4px at 15% 22%, #ffe9a8, transparent 60%),
  radial-gradient(1.8px 1.8px at 47% 17%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 72% 9%, #fff, transparent 60%),
  radial-gradient(1.4px 1.4px at 88% 27%, #ffe9a8, transparent 60%),
  radial-gradient(1.2px 1.2px at 5% 42%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 95% 62%, #fff, transparent 60%),
  radial-gradient(1.2px 1.2px at 30% 70%, #fff, transparent 60%)}
@keyframes twinkle{50%{opacity:.35}}
.moon{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:22px;width:40px;height:40px;filter:drop-shadow(0 0 14px rgba(255,233,168,.4));opacity:.92}
.hills{position:absolute;left:0;bottom:0;width:100%;height:124px}
.hills .win{animation:flicker 3.2s steps(1,end) infinite}
.hills .win.w2{animation-delay:-1.4s}
@keyframes flicker{0%{opacity:1}46%{opacity:1}48%{opacity:.55}52%{opacity:1}80%{opacity:.8}84%{opacity:1}}

/* App frame */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:8px 12px;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 4px}
.title{min-width:0}
.kicker{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--glow)}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.05;text-wrap:balance}
.subrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.sub{margin:0;font-size:13px;color:var(--ink-dim);font-weight:700}
.mode-pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--edge);background:rgba(23,16,52,.78);color:var(--glow);font:800 13px/1 var(--font-body);cursor:pointer}
.mode-pill svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mode-pill:focus-visible,.level:focus-visible,.sheet-card .close:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.stats{display:flex;align-items:center;gap:14px;flex:none}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.stat span{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;font-weight:800;color:var(--ink-dim);margin-top:4px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--edge);background:rgba(23,16,52,.78);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}

/* Board */
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.jars{display:flex;flex-wrap:wrap;justify-content:center;column-gap:var(--gx,10px);row-gap:var(--gy,12px)}
.jar{
  position:relative;flex:none;
  width:calc(var(--item)*1.3);height:var(--jh);
  margin-top:calc(var(--item)*.6);
  border:2px solid var(--edge);
  border-radius:10px 10px calc(var(--item)*.6) calc(var(--item)*.6);
  background:linear-gradient(100deg, rgba(222,210,255,.14), rgba(222,210,255,.04) 45%, rgba(222,210,255,.09));
  cursor:pointer;
  animation:rise .5s cubic-bezier(.2,.9,.3,1.2) backwards;
  animation-delay:calc(var(--n,0)*55ms);
}
.jar::before{content:"";position:absolute;left:-5%;right:-5%;top:-6px;height:9px;border-radius:6px;border:2px solid var(--edge);background:var(--glass-hi)}
.jar::after{content:"";position:absolute;left:12%;top:14%;width:4px;height:48%;border-radius:3px;background:rgba(255,255,255,.2)}
.jar:focus-visible{outline:3px solid var(--glow);outline-offset:6px}
.jar.sel{border-color:var(--glow);box-shadow:0 0 0 1.5px var(--glow),0 0 26px rgba(255,179,92,.45)}
.jar.done{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc),0 0 18px -2px var(--gc);cursor:default}
.jar.nope{animation:nope .35s ease-in-out}
.jar.hint-to{animation:hintpulse .9s ease-in-out 2}
.stack{position:absolute;inset:0;display:flex;flex-direction:column-reverse;align-items:center;padding:calc(var(--item)*.2) calc(var(--item)*.15) calc(var(--item)*.3)}
.lid{position:absolute;z-index:4;left:-8%;right:-8%;top:calc(var(--item)*-.16);height:calc(var(--item)*.3);border-radius:8px;background:var(--gc,var(--glow));opacity:0;transform:translateY(-16px) scale(.9);transition:opacity .25s,transform .4s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.jar.done .lid{opacity:1;transform:none}
.item{flex:none;width:var(--item);height:var(--item);position:relative}
.item.sel{z-index:3}
.fig{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.item.sel .fig{animation:lift .16s ease-out forwards,wiggle 1.1s .16s ease-in-out infinite}
.item.cheer .fig{animation:cheer .55s var(--d,0ms) ease-in-out}
@keyframes lift{to{transform:translateY(calc(var(--item)*-.55))}}
@keyframes wiggle{0%,100%{transform:translateY(calc(var(--item)*-.55)) rotate(-5deg)}50%{transform:translateY(calc(var(--item)*-.55)) rotate(5deg)}}
@keyframes cheer{0%,100%{transform:none}35%{transform:translateY(calc(var(--item)*-.28)) scale(1.06,.96)}65%{transform:translateY(0) scale(1.08,.9)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hintpulse{50%{box-shadow:0 0 0 3px var(--glow),0 0 30px rgba(255,179,92,.65);border-color:var(--glow)}}

/* Tip line and actions */
.toast{min-height:46px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.3;color:var(--ink-dim);font-weight:700;text-wrap:balance;padding-inline:8px;transition:opacity .25s}
.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative;z-index:2}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:62px;padding:8px 2px;border-radius:18px;border:1.5px solid var(--edge);background:rgba(23,16,52,.8);color:var(--ink);font:800 12px/1 var(--font-body);cursor:pointer;white-space:nowrap}
.act svg{width:22px;height:22px}
.act:active,.icon-btn:active{transform:scale(.96)}
.act:disabled{opacity:.38;cursor:default}
.act[data-armed="true"]{border-color:var(--glow);color:var(--glow)}
.act:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--glow);outline-offset:3px}

/* Cleared sheet */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,5,26,.55)}
.sheet-card{width:min(100%,480px);padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--night-1);border:1.5px solid var(--edge);border-bottom:0;text-align:center;animation:sheetup .45s cubic-bezier(.2,.9,.3,1.1)}
.sheet-card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.1;text-wrap:balance}
.sheet-card p{margin:10px 0 0;font-size:15px;color:var(--ink-dim);font-weight:700;text-wrap:balance}
.sheet-card .go{margin-top:20px;width:100%;min-height:54px;border:0;border-radius:18px;background:var(--glow);color:#2a1300;font:800 17px/1 var(--font-body);cursor:pointer}
.sheet-card .go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.levels{display:grid;gap:8px;margin-top:16px}
.level{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--edge);background:rgba(255,255,255,.04);color:var(--ink);text-align:left;font:800 16px/1.2 var(--font-body);cursor:pointer}
.level small{display:block;margin-top:3px;color:var(--ink-dim);font-weight:700;font-size:13px}
.level .tick{width:22px;height:22px;flex:none;stroke:var(--glow);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.level[aria-checked="true"]{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow)}
.level[aria-checked="true"] .tick{opacity:1}
.sheet-card .close{margin-top:14px;width:100%;min-height:48px;border-radius:16px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);font:800 15px/1 var(--font-body);cursor:pointer}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}}
.flyby{position:fixed;top:14%;left:0;z-index:11;width:64px;height:64px;pointer-events:none;opacity:0}
.flyby.go{animation:flyx 3.4s ease-in-out forwards}
.flyby svg{width:100%;height:100%;animation:bob 1.1s ease-in-out infinite}

<script>
(function(){
'use strict';

//#LOGIC-START
const CAP = 4;
const MAX_TYPES = 12;

function topRun(tb){
  if(!tb.length) return 0;
  const t = tb[tb.length-1];
  let r = 1;
  while(r < tb.length && tb[tb.length-1-r] === t) r++;
  return r;
}
function isUniform(tb){ return tb.length > 0 && tb.every(x => x === tb[0]); }
function isComplete(tb, cap){ return tb.length === cap && tb.every(x => x === tb[0]); }
function legal(ts, a, b, cap){
  if(a === b) return false;
  const A = ts[a], B = ts[b];
  if(!A.length || B.length >= cap) return false;
  if(B.length && B[B.length-1] !== A[A.length-1]) return false;
  return true;
}
function pourN(ts, a, b, cap){ return Math.min(topRun(ts[a]), cap - ts[b].length); }
function solved(ts, cap){ return ts.every(tb => tb.length === 0 || isComplete(tb, cap)); }
function hasUsefulMove(ts, cap){
  for(let a = 0; a < ts.length; a++){
    if(!ts[a].length || isComplete(ts[a], cap)) continue;
    for(let b = 0; b < ts.length; b++){
      if(!legal(ts, a, b, cap)) continue;
      if(ts[b].length === 0 && isUniform(ts[a])) continue;
      return true;
    }
  }
  return false;
}
function heur(ts){
  let runs = 0;
  for(const tb of ts) for(let i = 0; i < tb.length; i++) if(i === 0 || tb[i] !== tb[i-1]) runs++;
  return runs;
}
function heapPush(h, n){
  h.push(n);
  let i = h.length - 1;
  while(i > 0){
    const p = (i - 1) >> 1;
    if(h[p].f <= h[i].f) break;
    const t = h[p]; h[p] = h[i]; h[i] = t;
    i = p;
  }
}
function heapPop(h){
  const top = h[0], last = h.pop();
  if(h.length){
    h[0] = last;
    let i = 0;
    for(;;){
      const l = 2*i + 1, r = l + 1;
      let m = i;
      if(l < h.length && h[l].f < h[m].f) m = l;
      if(r < h.length && h[r].f < h[m].f) m = r;
      if(m === i) break;
      const t = h[m]; h[m] = h[i]; h[i] = t;
      i = m;
    }
  }
  return top;
}
// Greedy best-first search. Returns a list of [from, to] pours, [] if already solved, or null if not found within the node limit.
function solve(start, cap, limit){
  if(solved(start, cap)) return [];
  const key = ts => ts.map(t => t.map(x => x.toString(16)).join('')).sort().join('|');
  const seen = new Set([key(start)]);
  const heap = [];
  heapPush(heap, {ts:start, f:heur(start)*1000, g:0, p:null, a:-1, b:-1});
  let nodes = 0;
  while(heap.length && nodes < limit){
    const cur = heapPop(heap); nodes++;
    const ts = cur.ts;
    for(let a = 0; a < ts.length; a++){
      const A = ts[a];
      if(!A.length || isComplete(A, cap)) continue;
      const uni = isUniform(A);
      for(let b = 0; b < ts.length; b++){
        if(!legal(ts, a, b, cap)) continue;
        const B = ts[b];
        if(!B.length && uni) continue;
        const n = Math.min(topRun(A), cap - B.length);
        const nt = ts.map(t => t.slice());
        for(let i = 0; i < n; i++) nt[b].push(nt[a].pop());
        const k = key(nt);
        if(seen.has(k)) continue;
        seen.add(k);
        const node = {ts:nt, f:heur(nt)*1000 + cur.g + 1, g:cur.g + 1, p:cur, a:a, b:b};
        if(solved(nt, cap)){
          const path = [];
          let x = node;
          while(x.p){ path.push([x.a, x.b]); x = x.p; }
          return path.reverse();
        }
        heapPush(heap, node);
      }
    }
  }
  return null;
}
function shuffle(arr, rnd){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function adjScore(ts){
  let s = 0;
  for(const tb of ts) for(let i = 1; i < tb.length; i++) if(tb[i] === tb[i-1]) s++;
  return s;
}
// Fixed difficulty levels. Classic (no level) ramps up with the night number instead.
const TIERS = {
  easy:      {types:4,  samples:4,  gentle:true},
  medium:    {types:6,  samples:4,  gentle:false},
  hard:      {types:9,  samples:12, gentle:false},
  nightmare: {types:12, samples:20, gentle:false}
};
function nightSpec(n, mode){
  const t = mode && TIERS[mode];
  if(t) return {types:t.types, empties:2, quiet:false, gentle:t.gentle, samples:t.samples};
  const types = Math.min(MAX_TYPES, 3 + Math.floor((n - 1) / 2));
  const quiet = n % 5 === 0;
  const gentle = quiet || n <= 2;
  return {types:types, empties:2, quiet:quiet, gentle:gentle, samples: gentle ? 4 : 2 + Math.min(12, Math.floor(n / 2))};
}
function randomTs(types, empties, rnd){
  let ts = null;
  for(let tries = 0; tries < 50; tries++){
    const balls = [];
    for(let t = 0; t < types; t++) for(let c = 0; c < CAP; c++) balls.push(t);
    shuffle(balls, rnd);
    ts = [];
    for(let i = 0; i < types; i++) ts.push(balls.slice(i*CAP, (i+1)*CAP));
    if(!ts.some(tb => isComplete(tb, CAP))) break;
  }
  for(let e = 0; e < empties; e++) ts.push([]);
  return ts;
}
function makeBoard(n, rnd, mode){
  rnd = rnd || Math.random;
  const spec = nightSpec(n, mode);
  const cands = [];
  for(let k = 0; k < spec.samples; k++){
    const ts = randomTs(spec.types, spec.empties, rnd);
    cands.push({ts:ts, score:adjScore(ts)});
  }
  // Harder nights pick the most scrambled sample, gentle nights pick the least.
  cands.sort((x, y) => spec.gentle ? y.score - x.score : x.score - y.score);
  for(const c of cands) if(solve(c.ts, CAP, 20000)) return {ts:c.ts, spec:spec};
  let last = null;
  for(let i = 0; i < 24; i++){
    last = randomTs(spec.types, spec.empties, rnd);
    if(solve(last, CAP, 60000)) return {ts:last, spec:spec};
  }
  return {ts:last, spec:spec};
}
//#LOGIC-END

/* ---------- Characters ---------- */
const NAMES = ['pumpkin','ghost','bat','slime','candy corn','witch hat','candy','spider','skull','eyeball','black cat','mummy'];
const PLURAL = ['pumpkins','ghosts','bats','slimes','candy corn','witch hats','candies','spiders','skulls','eyeballs','black cats','mummies'];

const INK = '#1d1440';
function face(cx, cy, sp, er, blush, ink, hl){
  sp = sp || 4.4; er = er || 2.5;
  ink = ink || INK; hl = hl || '#fff';
  const eye = x => '<ellipse cx="'+x+'" cy="'+cy+'" rx="'+er+'" ry="'+(er*1.15).toFixed(2)+'" fill="'+ink+'"/>'
    + '<circle cx="'+(x+er*.3).toFixed(2)+'" cy="'+(cy-er*.4).toFixed(2)+'" r="'+(er*.4).toFixed(2)+'" fill="'+hl+'"/>';
  let s = eye(cx - sp) + eye(cx + sp);
  s += '<path d="M'+(cx-2.4)+' '+(cy+4.4)+'Q'+cx+' '+(cy+7)+' '+(cx+2.4)+' '+(cy+4.4)+'" fill="none" stroke="'+ink+'" stroke-width="1.7" stroke-linecap="round"/>';
  if(blush !== false){
    s += '<circle cx="'+(cx-sp-2.7)+'" cy="'+(cy+3.7)+'" r="2" fill="#ff7aa8" opacity=".5"/>'
       + '<circle cx="'+(cx+sp+2.7)+'" cy="'+(cy+3.7)+'" r="2" fill="#ff7aa8" opacity=".5"/>';
  }
  return s;
}
const ART = [

  // candy corn
  '<path d="M20 8.2Q20.6 5.5 24 5.5Q27.4 5.5 28 8.2L32.1 18H15.9Z" fill="#fff6e0"/><path d="M15.9 18H32.1L36.2 30H11.8Z" fill="#ff9a3c"/><path d="M11.8 30H36.2L40 40.2Q40.8 42.5 38.2 42.5H9.8Q7.2 42.5 8 40.2Z" fill="#ffd43b"/>' + face(24, 23.4, 3.8, 2.2),
  // witch hat

  '<path d="M14 24L3 15.5V32.5Z" fill="#ff9cc6"/><path d="M34 24L45 15.5V32.5Z" fill="#ff9cc6"/><circle cx="24" cy="24" r="12.5" fill="#ff6ba8"/><path d="M14.4 16.6Q11.8 24 14.6 31.6M33.6 16.6Q36.2 24 33.4 31.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>' + face(24, 23.4, 4.1, 2.4, false),

const MODES = [
  ['classic', 'Classic', 'Starts small and grows every night'],
  ['easy', 'Easy', '4 kinds, 6 jars'],
  ['medium', 'Medium', '6 kinds, 8 jars'],

];

/* ---------- State ---------- */
const $ = s => document.querySelector(s);
const board = $('#board'), jarsEl = $('#jars'), toastEl = $('#toast'), sheet = $('#sheet'), flyby = $('#flyby');
const btnUndo = $('#undo'), btnHint = $('#hint'), btnJar = $('#addjar'), btnRestart = $('#restart'), btnDeal = $('#newdeal'), btnSound = $('#sound');

let tubes = [], initial = [], spec = null, history = [], moves = 0;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ return {}; } }

function snapshotState(nextNight){
  const b = (won || !tubes.length) ? null : {init: initial.map(t => t.map(x => x.toString(16)).join('')), cur: tubes.map(tb => tb.map(x => x.t.toString(16)).join('')), moves: moves};
  progress[mode] = nextNight;
  return {mode:mode, progress:Object.assign({}, progress), night:nextNight, cleared:cleared, sound:soundOn, board:b, updated:Date.now()};
}
// Saves to this phone right away, and to the account store a moment later.
function save(nextNight){
  const s = snapshotState(nextNight);
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  if(cloud){ cloudDirty = s; clearTimeout(cloudT); cloudT = setTimeout(flushCloud, 700); }
}
async function flushCloud(){
  if(!cloud || cloudBusy || !cloudDirty) return;
  cloudBusy = true;
  const s = cloudDirty; cloudDirty = null;
  try{ await cloud.set(s); }catch(e){}
  cloudBusy = false;
  if(cloudDirty){ clearTimeout(cloudT); cloudT = setTimeout(flushCloud, 700); }
}
async function connectCloud(){
  try{
    if(!window.claude || !window.claude.use) return null;
    const pair = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = pair[0], user = pair[1];
    if(!db || !user) return null;
    const id = await user.id();
    if(!id) return null;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    return {ref:ref, data: snap.exists ? snap.data() : null};
  }catch(e){ return null; }
}
const toTypes = () => tubes.map(tb => tb.map(x => x.t));
const busy = () => performance.now() < busyUntil;

/* ---------- Sound ---------- */
let ac = null;
function actx(){
  if(!soundOn) return null;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
  }catch(e){ return null; }
  return ac;
}
function tone(f, at, d, type, v){
  const c = actx(); if(!c) return;
  const t = c.currentTime + (at || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || .1, t + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (d || .14));
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + (d || .14) + .03);
}
const sfx = {
  pick(){ tone(620, 0, .09, 'triangle', .09); },
  drop(n){ for(let i = 0; i < n; i++) tone(380 + i*60, i*.07, .12, 'sine', .12); },
  nope(){ tone(170, 0, .14, 'square', .035); },
  undo(){ tone(300, 0, .1, 'sine', .08); },
  done(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, i*.08, .22, 'triangle', .08)); },
  win(){ [523, 659, 784, 1046, 1319].forEach((f, i) => tone(f, i*.11, .4, 'triangle', .09)); }
};
function reflectSound(){
  $('#sndOn').hidden = !soundOn;
  $('#sndOff').hidden = soundOn;
  btnSound.setAttribute('aria-pressed', String(soundOn));
  btnSound.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
}

/* ---------- Messages ---------- */
let toastT = 0;
function say(msg, ms){
  clearTimeout(toastT);
  toastEl.textContent = msg || '';
  toastEl.style.opacity = msg ? 1 : 0;
  if(msg && ms) toastT = setTimeout(() => { toastEl.style.opacity = 0; }, ms);
}

/* ---------- Building the board ---------- */
function makeItem(it){
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = '<svg class="fig" viewBox="0 0 48 48" aria-hidden="true">' + ART[it.t] + '</svg>';
  items.set(it.id, el);
  return el;
}
function buildJar(i){
  const el = document.createElement('div');
  el.className = 'jar';
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.dataset.i = i;
  el.style.setProperty('--n', i);
  el.innerHTML = '<div class="lid"></div><div class="stack"></div>';
  jarsEl.appendChild(el);
  jarEls[i] = {el:el, stack:el.querySelector('.stack'), done:false};
}
function loadBoard(ts, sp, init, m){
  hideSheet();
  disarmRestart(); disarmDeal();
  won = false; sel = -1; history = []; moves = m | 0; busyUntil = 0;
  spec = sp;
  initial = (init || ts).map(t => t.slice());
  extraUsed = ts.length > initial.length;
  if(moves > 0) tipSeen = true;
  tubes = ts.map(tb => tb.map(t => ({id:nextId++, t:t})));
  jarsEl.textContent = '';
  items.clear(); jarEls = [];
  tubes.forEach((_, i) => buildJar(i));
  tubes.forEach((tb, i) => tb.forEach(it => {
    const el = makeItem(it);
    el._tube = i;
    jarEls[i].stack.appendChild(el);
  }));
  layout();
  updateJars(true);
  hud();
  if(night === 1 && !tipSeen) say('Tap a jar to lift its top friends, then tap where they should go. Only matching friends can stack.');
  else if(spec.quiet) say('A quiet night. Take your time.', 3500);
  else say('');
  save(night);
}
function newNight(){
  const b = makeBoard(night, null, mode);
  loadBoard(b.ts, b.spec);
}
function layout(){
  const W = board.clientWidth, H = board.clientHeight, n = tubes.length;
  if(!W || !H || !n) return;
  const gx = 10, gy = 12;
  // Try one to four rows and keep the arrangement that gives the biggest characters.
  const rMin = n <= 5 ? 1 : 2, rMax = n <= 5 ? 1 : 4;
  let cols = n, rows = 1, best = 0;
  for(let r = rMin; r <= rMax; r++){
    const c = Math.ceil(n / r);
    const bw = (W - (c - 1) * gx) / (c * 1.3);
    const bh = (H - (r - 1) * gy - 4) / (r * (CAP + 1.15));
    const v = Math.min(bw, bh);
    if(v > best + 0.5){ best = v; cols = c; rows = r; }
  }
  const item = Math.max(18, Math.min(60, best));
  itemPx = item;
  jarsEl.style.setProperty('--item', item + 'px');
  jarsEl.style.setProperty('--jh', ((CAP + .55) * item) + 'px');
  jarsEl.style.setProperty('--gx', gx + 'px');
  jarsEl.style.setProperty('--gy', gy + 'px');
  jarsEl.style.width = (cols * item * 1.3 + (cols - 1) * gx + 2) + 'px';
}
function hud(){
  $('#nightTitle').textContent = 'Night ' + night;
  $('#modeName').textContent = (MODES.find(x => x[0] === mode) || MODES[0])[1];
  $('#sub').textContent = spec.types + ' kinds · ' + tubes.length + ' jars';
  $('#moves').textContent = moves;
  $('#survived').textContent = cleared;
  btnUndo.disabled = !history.length || won;
  btnHint.disabled = won;
  btnJar.disabled = extraUsed || won;
}
function updateJars(quiet){
  tubes.forEach((tb, i) => {
    const j = jarEls[i];
    const ts = tb.map(x => x.t);
    const done = isComplete(ts, CAP);
    j.el.setAttribute('aria-label', 'Jar ' + (i + 1) + (ts.length ? ': ' + ts.map(t => NAMES[t]).join(', ') + ' (bottom to top)' : ': empty'));
    if(done && !j.done){
      j.el.classList.add('done');
      j.el.style.setProperty('--gc', 'var(' + COLORS[ts[0]] + ')');
      if(!quiet){ sfx.done(); setTimeout(() => cheer(i), 380); }
    }
    if(!done && j.done) j.el.classList.remove('done');
    j.done = done;
  });
}
function cheer(i){
  const kids = Array.from(jarEls[i].stack.children);
  kids.forEach((el, k) => { el.style.setProperty('--d', (k * 70) + 'ms'); el.classList.add('cheer'); });
  setTimeout(() => kids.forEach(el => el.classList.remove('cheer')), 1100);
}

/* ---------- Moving things ---------- */
function clearSel(){
  sel = -1;
  jarsEl.querySelectorAll('.jar.sel').forEach(j => j.classList.remove('sel'));
  jarsEl.querySelectorAll('.item.sel').forEach(e => e.classList.remove('sel'));
}
function select(i){
  clearSel();
  sel = i;
  jarEls[i].el.classList.add('sel');
  const tb = tubes[i];
  const n = topRun(tb.map(x => x.t));
  for(let k = 0; k < n; k++) items.get(tb[tb.length - 1 - k].id).classList.add('sel');
}
function sync(animate){
  const first = new Map(), lifted = new Set();
  if(animate){
    items.forEach((el, id) => {
      if(el.isConnected) first.set(id, el.getBoundingClientRect());
      if(el.classList.contains('sel')) lifted.add(id);
    });
  }
  clearSel();
  tubes.forEach((tb, i) => {
    const stack = jarEls[i].stack;
    let cur = stack.firstChild;
    for(const it of tb){
      const el = items.get(it.id);
      if(el === cur) cur = cur.nextSibling;
      else stack.insertBefore(el, cur);
    }
  });
  let maxJ = -1;
  tubes.forEach((tb, i) => {
    let j = 0;
    for(const it of tb){
      const el = items.get(it.id);
      if(el._tube !== i){
        const f = first.get(it.id);
        if(animate && f && !reduce){
          hop(el, f, el.getBoundingClientRect(), j, lifted.has(it.id));
          maxJ = Math.max(maxJ, j);
        }
        j++;
        el._tube = i;
      }
    }
  });
  if(maxJ >= 0) busyUntil = performance.now() + 380 + 70 * maxJ;
}
function hop(el, f, l, j, wasLifted){
  const lift = wasLifted ? itemPx * .55 : 0;
  const dx = f.left - l.left, dy = f.top - l.top - lift;
  const arc = Math.min(70, Math.max(24, Math.hypot(dx, dy) * .35));
  el.style.zIndex = 6;
  const a = el.animate([
    {transform:'translate('+dx+'px,'+dy+'px) scale(1,1)', offset:0},
    {transform:'translate('+(dx*.5)+'px,'+(dy*.5 - arc)+'px) scale(.94,1.06)', offset:.5},
    {transform:'translate(0,0) scale(1.08,.9)', offset:.82},
    {transform:'translate(0,0) scale(1,1)', offset:1}
  ], {duration:380, delay:j * 70, easing:'cubic-bezier(.4,.1,.4,1)', fill:'backwards'});
  const clear = () => { el.style.zIndex = ''; };
  a.onfinish = clear; a.oncancel = clear;
}
function shake(i){
  const el = jarEls[i].el;
  el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
  setTimeout(() => el.classList.remove('nope'), 400);
}
function onTap(i){
  if(busy() || won || !jarEls[i]) return;
  const ts = toTypes();
  const T = ts[i];
  if(sel < 0){
    if(!T.length || isComplete(T, CAP)){ shake(i); sfx.nope(); return; }
    select(i); sfx.pick();
    return;
  }
  if(sel === i){ clearSel(); sfx.undo(); return; }
  if(legal(ts, sel, i, CAP)){ move(sel, i); return; }
  const A = ts[sel];
  if(T.length && !isComplete(T, CAP) && T[T.length - 1] !== A[A.length - 1]){ select(i); sfx.pick(); }
  else { shake(i); sfx.nope(); }
}
function move(a, b){
  history.push(tubes.map(t => t.slice()));
  const n = pourN(toTypes(), a, b, CAP);
  for(let k = 0; k < n; k++) tubes[b].push(tubes[a].pop());
  moves++;
  if(!tipSeen){ tipSeen = true; say(''); }
  sync(true);
  sfx.drop(n);
  hud();
  save(night);
  afterMove();
}
function afterMove(){
  updateJars(false);
  const ts = toTypes();
  if(solved(ts, CAP)){
    won = true; cleared++; save(night + 1);
    hud();
    setTimeout(winNight, 1000);
    return;
  }
  if(!hasUsefulMove(ts, CAP)) say('No moves left. Undo, or add a jar.', 4500);
}
function undo(){
  if(busy() || won || !history.length) return;
  const snap = history.pop();
  tubes = snap.map(t => t.slice());
  while(tubes.length < jarEls.length) tubes.push([]);
  moves = Math.max(0, moves - 1);
  sync(true);
  updateJars(true);
  sfx.undo();
  hud();
  save(night);
}
function hint(){
  if(busy() || won) return;
  const path = solve(toTypes(), CAP, 30000);
  if(!path){ say('This one looks stuck. Try undo or add a jar.', 4000); return; }
  if(!path.length) return;
  const a = path[0][0], b = path[0][1];
  select(a);
  const el = jarEls[b].el;
  el.classList.add('hint-to');
  setTimeout(() => el.classList.remove('hint-to'), 2000);
  say('Lifted friends go to the glowing jar.', 3500);
  sfx.pick();
}
function addJar(){
  if(extraUsed || won || busy()) return;
  extraUsed = true;
  tubes.push([]);
  buildJar(tubes.length - 1);
  jarEls[tubes.length - 1].el.style.setProperty('--n', 0);
  layout(); updateJars(true); hud();
  say('Extra jar added.', 2200);
  sfx.pick();
  save(night);
}
// A button that asks for a second tap when it would throw away moves.
function armable(btn, labelEl, base, needsConfirm, action){
  let armed = false, t = 0;
  function disarm(){
    armed = false; clearTimeout(t);
    btn.removeAttribute('data-armed');
    labelEl.textContent = base;
  }
  btn.addEventListener('click', () => {
    if(busy()) return;
    if(!needsConfirm()){ disarm(); action(); return; }
    if(!armed){
      armed = true;
      btn.setAttribute('data-armed', 'true');
      labelEl.textContent = 'Tap again';
      t = setTimeout(disarm, 2200);
      return;
    }
    disarm(); action();
  });
  return disarm;
}
const disarmRestart = armable(btnRestart, $('#restartLabel'), 'Restart', () => moves > 0 && !won, () => { won = false; loadBoard(initial, spec); });
const disarmDeal = armable(btnDeal, $('#dealLabel'), 'New deal', () => moves > 0 && !won, () => { newNight(); });

/* ---------- Difficulty ---------- */
function buildLevels(){
  const box = $('#levels');
  box.textContent = '';
  MODES.forEach(m => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'level';
    b.dataset.mode = m[0];
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(m[0] === mode));
    b.innerHTML = '<span>' + m[1] + '<small>' + m[2] + '</small></span>'
      + '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
    box.appendChild(b);
  });
}
function openModes(){ if(won) return; buildLevels(); modeSheet.hidden = false; }
function closeModes(){ modeSheet.hidden = true; }
function setMode(m){
  mode = m;
  night = progress[m] || 1;
  newNight();
}

/* ---------- Clearing a night ---------- */
function winNight(){
  sfx.win();
  flyby.classList.remove('go'); void flyby.offsetWidth; flyby.classList.add('go');
  const present = Array.from(new Set(initial.flat()));
  const t = present[Math.floor(Math.random() * present.length)];
  $('#shTitle').textContent = 'Night ' + night + ' cleared';
  $('#shLine').textContent = 'All the ' + PLURAL[t] + ' are tucked in. ' + moves + (moves === 1 ? ' move.' : ' moves.');
  $('#shStat').textContent = cleared + (cleared === 1 ? ' night survived' : ' nights survived');
  setTimeout(() => { sheet.hidden = false; $('#next').focus({preventScroll:true}); }, 450);
}
function hideSheet(){ sheet.hidden = true; }

/* ---------- Wiring ---------- */
jarsEl.addEventListener('click', e => {
  const j = e.target.closest('.jar');
  if(j) onTap(+j.dataset.i);
});
jarsEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const j = e.target.closest('.jar');
  if(j){ e.preventDefault(); onTap(+j.dataset.i); }
});
btnUndo.addEventListener('click', undo);
btnHint.addEventListener('click', hint);
btnJar.addEventListener('click', addJar);
$('#mode').addEventListener('click', openModes);
$('#mdClose').addEventListener('click', closeModes);
modeSheet.addEventListener('click', e => { if(e.target === modeSheet) closeModes(); });
$('#levels').addEventListener('click', e => {
  const b = e.target.closest('.level');
  if(!b || busy()) return;
  closeModes();
  if(b.dataset.mode !== mode) setMode(b.dataset.mode);
});
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  reflectSound();
  save(won ? night + 1 : night);
  if(soundOn) sfx.pick();
});
$('#next').addEventListener('click', () => {
  night = progress[mode] || night + 1;
  newNight();
});
window.addEventListener('resize', layout);
if(window.ResizeObserver) new ResizeObserver(layout).observe(board);

function parseTubes(arr, types){
  if(!Array.isArray(arr)) return null;
  const ts = arr.map(s => typeof s === 'string' ? s.split('').map(ch => parseInt(ch, 16)) : null);
  if(ts.some(t => !t || t.length > CAP || t.some(x => !(x >= 0 && x < types)))) return null;
  return ts;
}
function validBoard(b, types){
  const init = parseTubes(b.init, types), cur = parseTubes(b.cur, types);
  if(!init || !cur || cur.length < init.length || cur.length > init.length + 1) return null;
  const count = ts => { const c = new Array(types).fill(0); ts.forEach(t => t.forEach(x => c[x]++)); return c; };
  if(!count(init).every(v => v === CAP) || !count(cur).every(v => v === CAP)) return null;
  return {init:init, cur:cur};
}
function applyState(d){
  mode = (d.mode && TIERS[d.mode]) ? d.mode : 'classic';
  const pr = d.progress || {};
  MODES.forEach(m => { progress[m[0]] = Math.max(1, (pr[m[0]] | 0) || 1); });
  if(!d.progress && d.night) progress.classic = Math.max(1, d.night | 0);
  night = progress[mode];
  cleared = d.cleared | 0;
  soundOn = d.sound !== false;
  appliedAt = d.updated | 0;
  reflectSound();
  const sp = nightSpec(night, mode);
  const vb = d.board ? validBoard(d.board, sp.types) : null;
  if(vb && !solved(vb.cur, CAP)) loadBoard(vb.cur, sp, vb.init, d.board.moves);
  else newNight();
}
function flushNow(){ clearTimeout(cloudT); flushCloud(); }
document.addEventListener('visibilitychange', () => { if(document.hidden) flushNow(); });
window.addEventListener('pagehide', flushNow);

const hot = window.claude && window.claude.hot;
try{ if(hot && hot.snapshot) hot.snapshot(() => ({night:night, cleared:cleared, sound:soundOn})); }catch(e){}
function boot(data){
  if(booted) return;
  booted = true;
  const local = load();
  const connecting = connectCloud();
  const wait = new Promise(r => setTimeout(() => r('late'), 1800));
  Promise.race([connecting, wait]).then(res => {
    let d = Object.assign({}, local, data || {});
    if(res && res !== 'late'){
      cloud = res.ref;
      if(res.data && (res.data.updated | 0) > (d.updated | 0)) d = res.data;
    }
    applyState(d);
    if(res === 'late'){
      connecting.then(c => {
        if(!c) return;
        cloud = c.ref;
        if(c.data && (c.data.updated | 0) > appliedAt && moves === 0 && !won) applyState(c.data);
      });
    }
  });
}
try{
  if(hot && hot.ready) hot.ready(boot);
  else boot(hot && hot.data);
}catch(e){ boot(); }
})();
</script>
<script>if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
